services:
  db:
    image: postgres:15-alpine
    container_name: aesthetic_postgres
    environment:
      POSTGRES_DB: aesthetic_db
      POSTGRES_USER: aesthetic_user
      POSTGRES_PASSWORD: aesthetic_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
